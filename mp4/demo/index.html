<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>@player/mp4 演示 —— 本地文件 / HTTP Range 渐进播放</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
         background: #0d1117; color: #e6edf3; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; }
  h1 { font-size: 20px; margin: 0; }
  #drop { width: min(880px, 94vw); border: 2px dashed #30363d; border-radius: 12px;
          padding: 28px; text-align: center; transition: border-color .15s; cursor: pointer; }
  #drop.over { border-color: #58a6ff; }
  #urlbox { width: min(880px, 94vw); display: flex; gap: 8px; }
  #urlbox input { flex: 1; background: #161b22; border: 1px solid #30363d; color: inherit;
                  border-radius: 8px; padding: 10px 12px; }
  button { background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:disabled { opacity: .5; }
  video { width: min(880px, 94vw); max-height: 60vh; background: #000; border-radius: 12px; }
  pre { width: min(880px, 94vw); background: #161b22; border-radius: 8px; padding: 12px;
        font-size: 12px; overflow: auto; max-height: 220px; }
</style>
</head>
<body>
<h1>@player/mp4 · ISO-BMFF Demux → fMP4 Remux → MSE</h1>

<div id="drop">把 .mp4 / .m4v 文件拖到这里（或点击选择）<br /><small>数据不离开浏览器，全部本地解析</small></div>

<div id="urlbox">
  <input id="url" placeholder="或输入 mp4 直链（服务器需支持 HTTP Range）" />
  <button id="playUrl">渐进播放</button>
</div>

<video id="video" controls playsinline></video>
<pre id="log">等待输入…</pre>

<script type="module">
import { Mp4Demuxer, HttpRangeDataSource, attachFileDrop, pickFile, remuxDemuxer } from '../src/index.js';
import { BlobDataSource, MseHelper, detectCapabilities, Stats } from '../../core/src/index.js';

const log = (msg) => { document.getElementById('log').textContent += msg + '\n'; };
const video = document.getElementById('video');
const stats = new Stats();

detectCapabilities({}).then((cap) => {
  log(`环境能力：WebCodecs=${cap.webcodecs.available} MSE=${cap.mse.available} AudioWorklet=${cap.audioWorklet}`);
});

let mse = null;

async function playSource(source) {
  mse?.destroy();
  const demuxer = new Mp4Demuxer();
  demuxer.attach(source);
  const info = await demuxer.init();
  log(`容器=${info.container} 分片=${info.fragmented} 时长=${(info.durationUs / 1e6).toFixed(2)}s`);
  for (const t of info.tracks) {
    log(`轨道 #${t.id} ${t.type} codec=${t.codec || '(未知)'} ${t.width ? `${t.width}x${t.height}` : `${t.sampleRate ?? ''}Hz`}`);
  }

  mse = new MseHelper(video);
  await mse.open();
  const remuxed = await remuxDemuxer(demuxer);
  for (const { track, init, segments } of remuxed) {
    const key = `track${track.id}`;
    const mime = `${track.type === 'audio' ? 'audio' : 'video'}/mp4; codecs="${track.codec}"`;
    try {
      await mse.addTrack(key, mime);
    } catch (err) {
      log(`跳过不支持的轨：${mime}（${err.message}）`);
      continue;
    }
    await mse.append(key, init);
    let i = 0;
    for (const seg of segments) {
      await mse.append(key, seg.data);
      stats.markAppended(seg.data.byteLength);
      i++;
    }
    log(`轨 ${key} 已追加 ${i} 个媒体段（${(info.durationUs / 1e6).toFixed(1)}s）`);
  }
  video.play().catch(() => log('自动播放被拦截，请手动点击播放。'));
}

attachFileDrop(document.getElementById('drop'), (source) => {
  playSource(source).catch((e) => log(`错误 [${e.code ?? '?'}]：${e.message}`));
}, { accept: ['.mp4', '.m4v', '.mov'] });

document.getElementById('drop').addEventListener('click', () => {
  pickFile('.mp4,.m4v,.mov').then((file) => {
    if (file) playSource(new BlobDataSource(file)).catch((e) => log(`错误 [${e.code ?? '?'}]：${e.message}`));
  });
});

document.getElementById('playUrl').addEventListener('click', () => {
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  playSource(new HttpRangeDataSource(url))
    .catch((e) => log(`错误 [${e.code ?? '?'}]：${e.message}`));
});
</script>
</body>
</html>
