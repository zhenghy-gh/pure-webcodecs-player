<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAV · PurePlay</title>
  <!-- 新皮肤四件套（DESIGN.md v1.1 §11）；三区同构骨架 -->
  <link rel="stylesheet" href="../../site/css/tokens.css">
  <link rel="stylesheet" href="../../site/css/base.css">
  <link rel="stylesheet" href="../../site/css/layout.css">
  <link rel="stylesheet" href="../../site/css/components.css">
</head>
<body>
<div class="demo">
  <header class="topbar demo__topbar" data-skin="topbar">
    <a class="topbar__logo" href="../../site/index.html">
      <svg class="icon icon-20" aria-hidden="true"><use href="../../site/assets/icons.svg#i-logo"/></svg>
      <span class="topbar__title">PurePlay</span>
    </a>
    <nav class="tabs" data-skin="tabs">
      <a class="tabs__item" href="../../site/demo/index.html">总览</a>
      <a class="tabs__item is-active" href="./index.html">WAV</a>
      <a class="tabs__item" href="../flac/demo/index.html">FLAC</a>
      <a class="tabs__item" href="../ape/demo/index.html">APE</a>
      <a class="tabs__item" href="../subtitle/demo/index.html">字幕</a>
    </nav>
    <div class="topbar__actions">
      <span class="badge badge--neutral" id="stage-badge">未加载</span>
    </div>
  </header>

  <main class="stage demo__stage stage--audio is-idle" id="stage">
    <div class="stage__viewport" id="viewport">
      <canvas id="wave"></canvas>
    </div>
    <div class="stage__overlay">
      <div class="spinner" role="status"></div>
      <span class="buffering-text">缓冲中…</span>
    </div>
    <div class="drop" id="drop" data-skin="drop">
      <span class="drop__icon"><svg class="icon icon-32"><use href="../../site/assets/icons.svg#i-upload"/></svg></span>
      <strong>拖入 .wav 文件，或用下方方式载入</strong>
      <span>RIFF 解析 → AudioWorklet 调度播放 · 支持 u8/s16/s24/s32/f32 PCM</span>
      <div class="field field-row" style="max-width:520px">
        <input class="field__input" id="url" type="text" placeholder="或输入 .wav 地址（需允许跨域）">
        <button class="btn btn--solid field__btn" id="load-url">打开</button>
        <button class="btn btn--ghost field__btn" id="gen-demo">载入示例音</button>
      </div>
      <div class="drop__chips">
        <span class="chip">u8</span><span class="chip">s16</span><span class="chip">s24</span><span class="chip">s32</span><span class="chip">f32</span>
      </div>
      <span class="drop__hint">点击波形可跳转播放位置；解析全部在本地完成。</span>
    </div>
  </main>

  <footer class="controls demo__controls is-idle" id="controls">
    <div class="controls__group">
      <button class="btn-icon" data-skin="play" aria-label="播放">
        <svg class="icon"><use href="../../site/assets/icons.svg#i-play"/></svg></button>
      <span class="controls__time" id="cur">00:00</span>
      <div class="slider__wrap">
        <input class="slider slider--progress" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度">
      </div>
      <span class="controls__time controls__time--total" id="total">-:--</span>
    </div>
    <div class="controls__group">
      <button class="btn-icon" data-skin="mute" aria-label="静音">
        <svg class="icon"><use href="../../site/assets/icons.svg#i-volume-high"/></svg></button>
      <input class="slider slider--volume" type="range" min="0" max="100" value="100" aria-label="音量">
      <div class="menu" data-skin="rate" id="rate">
        <button class="btn-icon" aria-label="倍速"><span class="menu__label mono" style="font-size:12px">1x</span></button>
        <ul class="menu__list">
          <li><button class="menu__item" data-rate="0.5">0.5x</button></li>
          <li><button class="menu__item" data-rate="0.75">0.75x</button></li>
          <li><button class="menu__item menu__item--selected" data-rate="1">正常</button></li>
          <li><button class="menu__item" data-rate="1.25">1.25x</button></li>
          <li><button class="menu__item" data-rate="1.5">1.5x</button></li>
          <li><button class="menu__item" data-rate="2">2x</button></li>
        </ul>
      </div>
      <button class="btn-icon" data-skin="fs" aria-label="全屏">
        <svg class="icon"><use href="../../site/assets/icons.svg#i-expand"/></svg></button>
    </div>
  </footer>

  <aside class="panel demo__panel" id="panel">
    <section class="panel__section">
      <h2 class="panel__title">媒体信息</h2>
      <div class="kv"><span class="kv__key">容器</span><span class="kv__val">WAV (RIFF)</span></div>
      <div class="kv"><span class="kv__key">codec</span><span class="kv__val" id="i-codec">—</span></div>
      <div class="kv"><span class="kv__key">采样率</span><span class="kv__val" id="i-sr">—</span></div>
      <div class="kv"><span class="kv__key">声道</span><span class="kv__val" id="i-ch">—</span></div>
      <div class="kv"><span class="kv__key">时长</span><span class="kv__val" id="i-dur">—</span></div>
    </section>
    <section class="panel__section">
      <h2 class="panel__title">实时统计</h2>
      <div id="stats"><span class="chip">载入后显示</span></div>
    </section>
    <section class="panel__section">
      <h2 class="panel__title">元数据（LIST/INFO）</h2>
      <div id="meta"><span class="chip">—</span></div>
    </section>
  </aside>
</div>

<script type="module" src="../../site/js/skin.js"></script>
<script type="module">
  /* 页面胶水：皮肤原语 + WavPlayer（PlayerAdapter 协议）对接 */
  import { createWavPlayer, parseWavHeader, computePeaks, drawWaveform } from '../src/index.js';
  import Skin from '../../site/js/skin.js';

  const $ = s => document.querySelector(s);
  const player = createWavPlayer();
  const stage = $('#stage'), controls = $('#controls');
  const canvas = $('#wave');
  const progress = $('input.slider--progress'), volume = $('input.slider--volume');
  const playBtn = $('[data-skin="play"]'), muteBtn = $('[data-skin="mute"]');
  const fmt = Skin.formatTime;
  let peaks = null;
  let rafPending = false;
  const dur = () => player?.duration() || 0;

  if (!player) $('#drop strong').textContent = '当前环境不支持 WebAudio/AudioWorklet';
  Skin.initTabs();

  /* ---- 播放控制 ---- */
  function setPlaying(onNow) {
    controls.classList.toggle('is-playing', onNow);
    controls.classList.toggle('is-paused', !onNow);
    playBtn.setAttribute('aria-label', onNow ? '暂停' : '播放');
    playBtn.querySelector('use').setAttribute('href', `../../site/assets/icons.svg#i-${onNow ? 'pause' : 'play'}`);
  }
  playBtn.addEventListener('click', async () => {
    if (!player?.planar) return;
    try { player.state === 'playing' ? player.pause() : await player.play(); } catch (e) { toastErr(e); }
  });
  player?.on('play', () => setPlaying(true));
  player?.on('pause', () => setPlaying(false));
  player?.on('ended', () => setPlaying(false));

  /* ---- 进度 / 音量 / 倍速 ---- */
  Skin.bindRange(progress, {
    onCommit: v => { if (dur()) player.seek(v / 1000 * dur()); },
    onPreview: v => { if (dur()) $('#cur').textContent = fmt(v / 1000 * dur()); },
  });
  progress.dataset.buffered = '100';                     // 本地整段可得
  volume.addEventListener('input', () => {
    player?.setVolume(Number(volume.value) / 100);
    controls.classList.remove('is-muted');
    syncMuteIcon(false);
  });
  let lastVol = 100;
  muteBtn.addEventListener('click', () => {
    const m = !controls.classList.contains('is-muted');
    if (m && Number(volume.value) > 0) lastVol = Number(volume.value);
    volume.value = m ? 0 : lastVol;
    volume.dispatchEvent(new Event('input'));
    controls.classList.toggle('is-muted', m);
  });
  function syncMuteIcon(m) {
    muteBtn.querySelector('use').setAttribute('href',
      `../../site/assets/icons.svg#i-volume-${m ? 'mute' : Number(volume.value) > 50 ? 'high' : 'low'}`);
  }
  /* 倍速菜单接线 */
  const menu = $('#rate');
  $('.menu [aria-label="倍速"]').addEventListener('click', () => menu.classList.toggle('is-open'));
  for (const it of menu.querySelectorAll('.menu__item')) {
    it.addEventListener('click', () => {
      menu.querySelectorAll('.menu__item').forEach(x => x.classList.remove('menu__item--selected'));
      it.classList.add('menu__item--selected');
      menu.querySelector('.menu__label').textContent = `${it.dataset.rate}x`;
      menu.classList.remove('is-open');
      player?.setRate(Number(it.dataset.rate));
    });
  }

  /* ---- 时间联动与波形 ---- */
  player?.on('time', () => {
    if (!dur()) return;
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(() => { rafPending = false; redraw(); });
    }
    $('#cur').textContent = fmt(player.currentTime());
    progress.value = String(Math.round(player.currentTime() / dur() * 1000));
    progress.dispatchEvent(new Event('input'));
  });

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    redraw();
  }
  function redraw() {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    ctx.save();
    ctx.scale(dpr, dpr);
    drawWaveform(ctx, { width: canvas.clientWidth, height: canvas.clientHeight },
      peaks || { mins: new Float32Array(0), maxs: new Float32Array(0) },
      dur() ? player.currentTime() / dur() : 0,
      peaks ? undefined : { bg: '#000000' });
    ctx.restore();
  }
  window.addEventListener('resize', resize);
  resize();
  canvas.addEventListener('click', e => {
    if (!peaks || !dur()) return;
    const r = canvas.getBoundingClientRect();
    player.seek(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * dur());
  });

  /* ---- 全屏 / 快捷键 ---- */
  $('[data-skin="fs"]').addEventListener('click', () => Skin.toggleFullscreen(stage));
  $('#viewport').addEventListener('dblclick', () => Skin.toggleFullscreen(stage));
  Skin.bindKeys({
    ' ': () => playBtn.click(),
    f: () => $('[data-skin="fs"]').click(), F: () => $('[data-skin="fs"]').click(),
    m: () => muteBtn.click(), M: () => muteBtn.click(),
    ArrowLeft: () => dur() && player.seek(Math.max(0, player.currentTime() - 5)),
    ArrowRight: () => dur() && player.seek(Math.min(dur(), player.currentTime() + 5)),
  });

  /* ---- 统计面板（≥500ms 刷新，§6.4③） ---- */
  setInterval(() => {
    if (!player?.getStats || !peaks) return;
    $('#stats').innerHTML = player.getStats().map(([k, v]) =>
      `<div class="kv"><span class="kv__key">${k}</span><span class="kv__val">${String(v)}</span></div>`).join('');
  }, 500);

  /* ---- 装载入口 ---- */
  async function loadBytes(bytes, name) {
    try {
      const header = parseWavHeader(bytes);
      player.load(bytes);
      peaks = computePeaks(player.planar, Math.max(64, canvas.clientWidth));
      stage.classList.remove('is-idle');
      stage.classList.add('is-paused');
      setBadge('success', '就绪');
      $('#i-codec').textContent = `${header.codec} ${header.format.bitsPerSample}-bit`;
      $('#i-sr').textContent = `${header.format.sampleRate} Hz`;
      $('#i-ch').textContent = String(header.format.channels);
      $('#total').textContent = fmt(player.duration());
      $('#i-dur').textContent = fmt(player.duration());
      const metas = Object.entries(header.info);
      $('#meta').innerHTML = metas.length
        ? metas.map(([k, v]) => `<div class="kv"><span class="kv__key">${k}</span><span class="kv__val">${v}</span></div>`).join('')
        : '<span class="chip">无 INFO 元数据</span>';
      redraw();
      Skin.toast({ type: 'success', title: `已解析 ${name}`, detail: `${header.codec} · ${player.duration().toFixed(2)}s` });
    } catch (err) {
      setBadge('error', '解析失败');
      Skin.toast({ type: 'error', title: 'WAV 解析失败', detail: err?.message || String(err) });
    }
  }
  function setBadge(kind, text) {
    const b = $('#stage-badge');
    b.className = `badge badge--${kind}`;
    b.textContent = text;
  }
  function toastErr(e) {
    Skin.toast({ type: 'error', title: '播放出错', detail: e?.message || String(e) });
  }

  document.addEventListener('drop', async e => {
    const f = e.dataTransfer?.files?.[0];
    if (f) {
      if (!/\.(wav|wave)$/i.test(f.name)) { Skin.toast({ type: 'warn', title: '请拖入 .wav 文件' }); return; }
      loadBytes(new Uint8Array(await f.arrayBuffer()), f.name);
    }
  });
  $('#load-url').addEventListener('click', async () => {
    const url = $('#url').value.trim();
    if (!url) return;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      loadBytes(new Uint8Array(await res.arrayBuffer()), url.split('/').pop());
    } catch (err) { Skin.toast({ type: 'error', title: '地址加载失败', detail: err.message }); }
  });
  /* 内置示例：程序化生成 3s 扫频 s16 WAV（离线可复现） */
  $('#gen-demo').addEventListener('click', () => {
    const sr = 32000, sec = 3, frames = sr * sec;
    const bytes = new Uint8Array(44 + frames * 2);
    const dv = new DataView(bytes.buffer);
    const w = (o, s) => { for (let i = 0; i < 4; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); dv.setUint32(4, bytes.length - 8, true); w(8, 'WAVE');
    w(12, 'fmt '); dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    w(36, 'data'); dv.setUint32(40, frames * 2, true);
    for (let i = 0; i < frames; i++) {
      const t = i / sr, freq = 220 + (880 - 220) * (t / sec);
      const env = Math.min(1, t * 8) * Math.exp(-t * 0.6);
      dv.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * t) * env * 30000, true);
    }
    loadBytes(bytes, 'demo-sweep.wav（程序生成）');
  });
</script>
</body>
</html>
