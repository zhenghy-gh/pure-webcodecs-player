<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>@player/mov 演示 —— QuickTime 兼容播放</title>

<link rel="stylesheet" href="../../site/skin.css">
</head>
<body class="pp-scope">
<div data-site-nav data-root="../../"></div>
<main class="pp-lab pp-lab--mov ">
  <header class="pp-module-heading"><p class="pp-eyebrow">PUREPLAY / MEDIA LAB</p><h1>MOV 播放器</h1><p class="pp-module-copy">浏览器原生能力实验。选择内置样例即可体验，无需手动输入。</p></header>
  <section data-demo-samples></section>



<div id="drop">把 .mov 文件拖到这里（或点击选择）<br /><small>自动识别 QT 品牌 / wide / pnot；cmov 压缩 moov 会给出明确提示</small></div>

<video id="video" controls playsinline></video>
<pre id="log">等待输入…</pre>

</main>
<script type="module">
import { MovDemuxer } from '../src/index.js';
import { Mp4Demuxer, remuxDemuxer, attachFileDrop, pickFile } from '../../mp4/src/index.js';
import { BlobDataSource, HttpRangeDataSource, MseHelper } from '../../core/src/index.js';

const log = (msg) => { document.getElementById('log').textContent += msg + '\n'; };
const video = document.getElementById('video');

async function playSource(source) {
  // 自动选路：QuickTime 特征 vs 通用 ISO-BMFF
  const head = await source.read(0, Math.min(64, source.size));
  const Demuxer = MovDemuxer.probe(head).confidence >= Mp4Demuxer.probe(head).confidence ? MovDemuxer : Mp4Demuxer;
  log(`选路：${Demuxer === MovDemuxer ? 'MovDemuxer' : 'Mp4Demuxer'}`);

  const demuxer = new Demuxer(source);
  const info = await demuxer.open();
  if (Object.keys(info.qtTags ?? {}).length) log(`QT 元数据：${JSON.stringify(info.qtTags)}`);
  for (const t of info.tracks) {
    const extra = t.emptyEdit ? ' [空编辑 elst]' : '';
    log(`轨道 #${t.id} ${t.type} codec=${t.codec || '(未知)'}${extra}`);
  }

  const mse = new MseHelper(video);
  await mse.open();
  const remuxed = await remuxDemuxer(demuxer);
  const supported = [];
  for (const output of remuxed) {
    const { track } = output;
    const key = `track${track.id}`;
    const mime = `${track.type === 'audio' ? 'audio' : 'video'}/mp4; codecs="${track.codec}"`;
    try { await mse.addTrack(key, mime); supported.push({ ...output, key }); }
    catch { log(`跳过不支持的轨：${mime}`); }
  }
  for (const { key, init, segments } of supported) {
    await mse.append(key, init);
    for (const segment of segments) await mse.append(key, segment.data);
  }
  await mse.endOfStream();
  video.play().catch(() => log('自动播放被拦截，请手动点击播放。'));
}

document.addEventListener('demo:sample', event => {
  const source = new HttpRangeDataSource(event.detail.url);
  playSource(source).catch(error => log(`错误：${error.message}`));
});
const drop = document.getElementById('drop');
attachFileDrop(drop, (source) => {
  playSource(source).catch((e) => log(`错误 [${e.code ?? '?'}]：${e.message}`));
}, { accept: ['.mov', '.mp4'] });
drop.addEventListener('click', () => {
  pickFile('.mov,.mp4').then((file) => {
    if (file) playSource(new BlobDataSource(file)).catch((e) => log(`错误 [${e.code ?? '?'}]：${e.message}`));
  });
});
</script>
<script type="module" src="../../site/nav.js"></script>
<script type="module">
  import { initDemoSamples } from '../../site/demo-samples.js';
  const dispose = initDemoSamples('mov');
</script>
</body>
</html>
